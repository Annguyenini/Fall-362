# testing the database connection and checking get data

name: Database test
run-name: ${{ github_actor }} is running database test
## only run if push code to database or main branch
on:
  push:
    branches: [database,main]

jobs:
  database-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./back-end
    env:
      DATABASE_NAME: inventory
      DATABASE_USER: admin
      DATABASE_PASS: password
      POSTGRES_USER: admin
      POSTGRES_DB: inventory
      POSTGRES_PASSWORD: password
      POSTGRES_PORT: 5435
      POSEGRES_HOST: localhost
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Building database container
        run: |
          docker compose -f docker-compose_test.yaml down -v
          docker compose -f docker-compose_test.yaml up --build

      - name: Running test
        run: |
          chmod +x .github/cicd-tests/database_test.sh
          bash .github.cicd-tests/database_test.sh
