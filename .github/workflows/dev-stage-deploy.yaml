name: dev-stage-deploy
on:
  push:
    branches:
      - main

jobs:
  deploy-server:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4
      - name: Executing SSH using key
        env:
            REPO_PATH: Fall-362
            BACKEND_REPO_PATH: back-end
            IMAGE_NAME: fast-server
            IMAGE_VERSION: test--11
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PEM }}
          port: ${{ secrets.PORT }}
          script: |
            set -e
            cd Fall-362
            git fetch origin main
            git reset --hard origin/main

            echo "Deploy back end..."

            chmod +x .github/workflows/builds/build-backend.sh
            REPO_PATH="$REPO_PATH" \
            BACKEND_REPO_PATH="$BACKEND_REPO_PATH" \
            IMAGE_NAME="$IMAGE_NAME" \
            IMAGE_VERSION="$IMAGE_VERSION" \
            bash .github/workflows/builds/build-backend.sh

            echo "Deploying frontend..."
            cd ../front-end
            docker compose up -d --build

            echo "Deploying database..."
            cd ../database
            docker compose -f docker-compose_test.yaml up -d --build

            echo "Deployment completed!"
