## linter
#
name: Evironment testing for Backend
run-name:  running eviroment testing
## only run on main, back-end branch
on:
  push:
    branches: [back-end,main]
jobs:
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./back-end

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Create python environment
        run: |
            python3 -m venv venv
            ./venv/bin/pip install -r requirements.txt
      - name: Running linter
        run: |
          ./venv/bin/ruff check .
